  .headright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.lang button{border:0;border-radius:0;padding:5px 11px;font-size:12px;background:transparent;color:var(--muted)}.lang button.on{background:var(--mint);color:#10261b;font-weight:650}.legend .root-dot{background:#ffd27a;width:11px;height:11px}
  .legend .cited-dot{background:#79dfb2;width:14px;height:4px;border-radius:2px}
  .conclusion{border:1px solid var(--mint);background:#13261f;border-radius:10px;padding:14px 16px;margin:14px 0 6px}.conclusion h3{margin:0 0 6px;font-size:13px;letter-spacing:1px;color:var(--mint)}.conclusion p{margin:4px 0;font-size:16px;line-height:1.65;color:#fff}.cite-n{padding:0 5px;margin:0 1px;font-size:10px;line-height:16px;vertical-align:super;border-radius:4px}.glossary{margin:10px 0 4px;font-size:12px;color:var(--muted)}.glossary summary{cursor:pointer;color:var(--blue)}.glossary dt{color:var(--text);font-weight:650;margin-top:8px}.glossary dd{margin:2px 0 0 0;line-height:1.6}.status-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #proof-list{margin:6px 0 14px}#proof-list h4{margin:4px 0 6px;font-size:13px;color:var(--mint)}.proof-row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;margin:4px 0;padding:7px 10px;background:#13261f;border-color:#2c5a48;font-size:13px}.proof-cite{color:var(--mint);font-size:11px;white-space:nowrap}.trace-why,.trace-result{margin:6px 0;font-size:12px;line-height:1.6;color:var(--muted)}.trace-result{color:var(--text)}.trace-why b,.trace-result b{color:var(--text)}.trace-card details summary{cursor:pointer;font-size:11px;color:var(--blue);margin-top:6px}.trace-howto{font-size:12px;line-height:1.65;color:var(--muted);border-left:2px solid var(--blue);padding:4px 10px;margin:0 0 4px}
  .examples-box{margin:12px 0}.examples-box summary{cursor:pointer;font-size:12px;color:var(--blue);margin-bottom:8px}.examples{display:block;margin:0}.ex-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px}.ex-label{font-size:11px;color:var(--muted);width:100%;margin-top:2px}.ex-group button{font-size:12px;padding:5px 9px}
  .proof-item{margin:6px 0 10px}.proof-sentence{margin:0 0 4px;font-size:13px;color:var(--text);line-height:1.55}.proof-textonly{margin:2px 0 0;font-size:12px;color:var(--amber);padding-left:10px;border-left:2px solid var(--amber)}
  .gctl{display:flex;gap:6px;flex-wrap:wrap}.gctl button{padding:6px 10px}.gnav{margin:-4px 0 8px;font-size:11px}.legend .lg-title{color:var(--text);font-weight:600}.legend span{display:inline-flex;align-items:center;gap:5px}.legend-kinds{margin-bottom:4px}.trace-use{margin:6px 0;font-size:12px;color:var(--text)}.trace-use b{display:block;margin-bottom:4px}.trace-card.unused{opacity:.55}.trace-card.unused .trace-use{color:var(--muted)}

<body>
<header><div><h1><span class="brand">◈</span> OnCall Brain</h1><p data-i18n="tagline"></p></div><div class="headright"><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div></div></header>
<main>
  <section aria-label="Ask and answer">
    <h2 data-i18n="h_ask"></h2>
    <form id="ask-form"><label class="hint" for="question" data-i18n="ask_label"></label><textarea id="question" maxlength="4000" required data-i18n-ph="ask_ph"></textarea><p class="hint" id="q-label"></p><details class="examples-box" open><summary data-i18n="examples"></summary><div class="examples" id="examples"></div></details><div class="askbar"><button class="primary" id="ask-button" type="submit" data-i18n="ask_btn"></button><label class="hint mode"><input type="checkbox" id="deep"> <span data-i18n="deep"></span></label></div><p class="hint" data-i18n="cited"></p></form>
    <div id="activity" class="hint" role="status" aria-live="polite"></div><div id="answer-status"></div><div id="status-source"></div><details id="glossary" class="glossary"></details>
    <article id="answer" aria-live="polite"><div class="empty" data-i18n="answer_empty"></div></article>
  </section>
  <section aria-label="Knowledge graph">
    <div class="graph-head"><h2 data-i18n="h_graph"></h2><div class="tabs" role="tablist"><button type="button" data-view="path" class="on" data-i18n="tab_path"></button><button type="button" data-view="explore" data-i18n="tab_explore"></button></div></div>
    <div id="view-path">
      <p class="hint" data-i18n="path_hint"></p>
      <div id="path" role="img"><div class="empty" data-i18n="path_empty"></div></div>
      <div id="proof-list"></div>
    </div>
    <div id="view-explore" hidden>
      <div class="graph-head"><div class="gctl"><button id="zoom-in" type="button" title="+">＋</button><button id="zoom-out" type="button" title="-">－</button><button id="fit" type="button" data-i18n="fit"></button><button id="fit-proof" type="button" data-i18n="fit_proof"></button></div></div><p class="hint gnav" data-i18n="gnav"></p>
      <div id="graph" role="img"></div>
      <div class="legend legend-kinds"><span class="lg-title" data-i18n="lg_nodes"></span><span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#bdadff"/></svg><span data-i18n="k_person"></span></span><span><svg width="14" height="14"><polygon points="7,1 13,4.5 13,9.5 7,13 1,9.5 1,4.5" fill="#8abaff"/></svg><span data-i18n="k_module"></span></span><span><svg width="14" height="14"><rect x="1" y="1" width="12" height="12" rx="3" fill="#79dfb2"/></svg><span data-i18n="k_rule"></span></span><span><svg width="14" height="14"><polygon points="7,1 13,7 7,13 1,7" fill="#6fd3e0"/></svg><span data-i18n="k_resource"></span></span><span><svg width="16" height="12"><rect x="1" y="2" width="14" height="8" fill="#9aa9bd"/></svg><span data-i18n="k_procedure"></span></span><span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="none" stroke="#ffd27a" stroke-width="2.5"/></svg><span data-i18n="lg_root"></span></span></div>
      <div class="legend"><span class="lg-title" data-i18n="lg_edges"></span><span><i class="cited-dot"></i><span data-i18n="lg_cited"></span></span><span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#4b6f68" stroke-width="2"/></svg><span data-i18n="lg_rule"></span></span><span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#f5c56c" stroke-width="2" stroke-dasharray="4 3"/></svg><span data-i18n="lg_chat"></span></span></div>
      <p class="hint" id="graph-summary" data-i18n="graph_hint"></p>
      <form id="search-form" class="searchbar"><input id="search" aria-label="Search graph" data-i18n-ph="search_ph" maxlength="500" required><button type="submit" data-i18n="search"></button></form><div id="search-results"></div><div id="node-info"></div>
    </div>
  </section>
  <section aria-label="Tool trace"><div class="graph-head"><h2 data-i18n="h_trace"></h2><button id="ontology" type="button" data-i18n="ontology"></button></div><details id="trace-box"><summary id="trace-sum" data-i18n="trace_empty"></summary><div id="trace"></div></details><p class="footnote" data-i18n="footnote"></p></section>
</main>
<dialog id="evidence-dialog"><div class="dialog-head"><strong id="evidence-title">Evidence</strong><button id="close-dialog" type="button" aria-label="Close evidence">✕</button></div><div id="evidence-meta"></div><pre id="evidence-text"></pre></dialog>

    {selector:'node.cited',style:{'text-opacity':1,'border-width':3,'border-color':'#79dfb2','z-index':30,opacity:1}},
    {selector:'.focus',style:{'line-color':'#ffffff','target-arrow-color':'#ffffff','border-color':'#ffffff',width:5}},
    {selector:'edge[directed = false]',style:{'target-arrow-shape':'none'}},
    {selector:':selected',style:{'border-width':3,'border-color':'#fff'}}]});
  cy.on('tap','node',event=>expandNode(event.target.id()));
  cyPath = cytoscape({container: $('path'), elements: [], userZoomingEnabled: false, userPanningEnabled: true, boxSelectionEnabled: false, autoungrabify: true, style: [
    {selector: 'node', style: {shape: 'round-rectangle', width: 'label', height: 'label', padding: '10px', label: 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 170,
      'text-valign': 'center', 'text-halign': 'center', 'font-size': 14, 'line-height': 1.35, color: '#e5edf7', 'background-color': '#1b2430', 'border-width': 2, 'border-color': 'data(color)'}},
    {selector: 'node[?old]', style: {color: '#8a96a6', 'border-style': 'dashed', 'background-color': '#161b22'}},
    {selector: 'node[?q]', style: {'border-style': 'dashed', 'background-color': '#2a2414', color: '#ffe2a8'}},
    {selector: 'edge', style: {width: 2.2, 'line-color': '#79dfb2', 'target-arrow-color': '#79dfb2', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier',
      label: 'data(label)', 'font-size': 13, color: '#e5edf7', 'text-background-color': '#111820', 'text-background-opacity': 1, 'text-background-padding': 3, 'text-rotation': 'none'}},
    {selector: 'edge[?sup]', style: {'line-style': 'dashed', 'line-color': '#8a96a6', 'target-arrow-color': '#8a96a6', color: '#c9d2dd'}},
    {selector: 'edge[?q]', style: {'line-style': 'dashed', 'line-color': '#ffd27a', 'target-arrow-color': '#ffd27a', color: '#ffe2a8'}},
    {selector: '.focus', style: {'line-color': '#ffffff', 'target-arrow-color': '#ffffff', 'border-color': '#ffffff', width: 4}}]});
  cyPath.on('tap', 'edge', ev => {
    const aid = ev.target.data('aid'); if (!aid) return;
    const c = citations.find(x => x.aid === aid); const item = c && evidence.find(e => e.id === c.evidence_id);
    if (item) showEvidence(item, c.text);
  });
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
    const explore = b.dataset.view === 'explore';
    $('view-explore').hidden = !explore; $('view-path').hidden = explore;
    if (explore) { cy.resize(); const c = cy.$('.cited'); cy.fit(c.length ? c : undefined, 40); } else { cyPath.resize(); cyPath.fit(undefined, 16); }
  }));
  // Plain wheel scrolls the page; Ctrl+wheel zooms around the pointer.
  $('graph').addEventListener('wheel', ev => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    const b = $('graph').getBoundingClientRect();
    const z = Math.min(3, Math.max(0.15, cy.zoom() * (ev.deltaY < 0 ? 1.15 : 1 / 1.15)));
    cy.zoom({level: z, renderedPosition: {x: ev.clientX - b.left, y: ev.clientY - b.top}});
  }, {passive: false});
  const zoomBy = f => cy.zoom({level: Math.min(3, Math.max(0.15, cy.zoom() * f)), renderedPosition: {x: $('graph').clientWidth / 2, y: $('graph').clientHeight / 2}});
  $('zoom-in').onclick = () => zoomBy(1.25);
  $('zoom-out').onclick = () => zoomBy(1 / 1.25);
  $('fit-proof').onclick = () => { const c = cy.$('.cited'); if (c.length) { cy.animate({fit: {eles: c, padding: 60}, duration: 300}); } };
  // Names show for nodes this answer read; hovering reveals a node, its neighbours and their relations.
  cy.on('mouseover','node',e=>{e.target.addClass('hover');e.target.neighborhood().addClass('near');});
  cy.on('mouseout','node',e=>{e.target.removeClass('hover');e.target.neighborhood().removeClass('near');});
  cy.on('zoom',()=>cy.nodes().not('[?root]').style('text-opacity',cy.zoom()>1.6?1:0));
} else { $('graph').append(el('p',t('cdn_fail'),'error')); }
$('ask-form').addEventListener('submit',async event=>{
  event.preventDefault();if(busy || !$('question').value.trim())return;
  busy=true;$('ask-button').disabled=true;document.querySelectorAll('[data-example]').forEach(b=>b.disabled=true);activity($('deep').checked?t('busy_deep'):t('busy_fast')); document.querySelector('.examples-box').open=false;
  try { const data=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value,mode:$('deep').checked?'deep':'fast',lang})});renderAnswer(data);const tm=data.timings; activity(t('done',{mode:t(data.mode==='deep'?'mode_deep':'mode_fast'),steps:data.trace?.length ?? data.tool_calls ?? 0,ev:data.evidence.length})+(tm?t('timing',{g:(tm.retrieve+tm.decide+tm.read+(tm.hop||0)).toFixed(1),c:tm.compose.toFixed(1),t:tm.total.toFixed(1)}):'')); }
  catch(error){activity(error.message,true);}
  finally{busy=false;$('ask-button').disabled=false;document.querySelectorAll('[data-example]').forEach(b=>b.disabled=false);}
});
$('question').addEventListener('input', () => { askedLabel = ''; $('q-label').textContent = ''; });
fetch('/api/examples').then(r => r.json()).then(list => { for (const q of list) examples[`Q${q.qid}`] = q.question; renderExamples(); }).catch(() => {});
$('search-form').onsubmit=async event=>{event.preventDefault();try{const data=await api(`/api/search?q=${encodeURIComponent($('search').value)}`);$('search-results').replaceChildren();for(const n of data.candidates || []){const b=el('button',`${n.name} · ${n.kind}`);b.onclick=()=>expandNode(n.id);$('search-results').append(b);}if(!data.candidates?.length)$('search-results').append(el('span',t('not_found_entity'),'hint'));}catch(error){activity(error.message,true);}};
$('ontology').onclick=async()=>{try{const data=await api('/api/ontology');$('evidence-title').textContent=t('onto_title');$('evidence-meta').replaceChildren();$('evidence-text').textContent=JSON.stringify(data,null,2);$('evidence-dialog').showModal();}catch(error){activity(error.message,true);}};
$('fit').onclick=()=>cy?.fit(undefined,30);
$('close-dialog').onclick=()=>$('evidence-dialog').close();
applyLang();  // last: it renders the glossary with helpers defined above
</script>
</body>
</html>
