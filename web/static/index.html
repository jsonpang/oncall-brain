<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OnCall Brain · Graph-backed answers</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#101419;--panel:#181e26;--line:#303b48;--text:#e5edf7;--muted:#a2afbf;--mint:#79dfb2;--blue:#8abaff;--amber:#f5c56c;--red:#ff939e}
    *{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:#253140;color:var(--text)}button:hover{border-color:var(--mint)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--mint);outline-offset:2px}header{padding:19px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px;margin:0;letter-spacing:-.5px}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.brand{color:var(--mint)}.live{color:var(--mint);font-size:12px}main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,.7fr);gap:1px;background:var(--line);min-height:calc(100vh - 89px)}section{padding:22px;background:var(--panel);min-width:0}h2{font-size:12px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin:0 0 16px}.examples{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.examples button{font-size:12px;padding:6px 9px}textarea,input{background:#111820;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:12px;width:100%}textarea{min-height:115px;resize:vertical}.askbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mode{display:flex;align-items:center;gap:6px;cursor:pointer}.mode input{width:auto;margin:0}.primary{background:var(--mint);color:#10261b;font-weight:650;border-color:transparent}.hint{color:var(--muted);font-size:12px}#answer{margin-top:22px;overflow-wrap:anywhere}.answer-line{white-space:pre-wrap;margin:8px 0}.answer-heading{font-size:16px;color:#fff;margin:22px 0 9px}.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;border:1px solid currentColor;margin:3px 5px 3px 0}.applicable,.formal_rule{color:var(--mint)}.conflict,.not_found{color:var(--red)}.superseded,.stale{color:var(--muted)}.insufficient_context,.observation,.practice{color:var(--amber)}.citation{padding:2px 5px;margin:2px;font-size:11px;text-align:left;overflow-wrap:anywhere;max-width:100%;color:var(--mint);background:#162c27}.citation.chat{color:var(--amber);background:#31291a;border-style:dashed}.graph-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.graph-head h2{margin:0}#graph{height:470px;min-height:330px;border:1px solid var(--line);border-radius:9px;background:radial-gradient(ellipse at center,#202d36,#111820)}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin:10px 0 18px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--mint)}.legend .chat-dot{background:var(--amber)}.legend .node-dot{background:var(--blue)}.searchbar{display:flex;gap:7px}.searchbar input{padding:8px}#search-results{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}#search-results button{font-size:12px}#node-info{white-space:pre-wrap;font-size:12px;color:var(--muted);overflow-wrap:anywhere}#trace{display:grid;gap:11px}.trace-card{border:1px solid var(--line);border-radius:8px;padding:12px}.trace-title{font:600 12px ui-monospace,monospace;color:var(--blue)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,monospace;color:var(--muted);margin:8px 0}.templates{color:var(--mint);font:11px/1.6 ui-monospace,monospace}.empty{border:1px dashed var(--line);padding:23px 16px;border-radius:8px;color:var(--muted);font-size:13px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(760px,92vw);max-height:85vh;padding:24px}dialog::backdrop{background:#000a}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:start}#evidence-title{font-size:15px;overflow-wrap:anywhere}#evidence-text{font:14px/1.8 system-ui,sans-serif;color:var(--text);border-left:2px solid var(--mint);padding:14px;background:#111820}.error{color:var(--red)}#activity{min-height:20px;margin-top:9px}.footnote{font-size:11px;color:var(--muted);margin-top:16px}#status-source{font-size:11px;color:var(--muted)}@media(min-width:1450px){#graph{height:570px}}@media(max-width:1100px){main{grid-template-columns:1fr 1fr}section:last-child{grid-column:1/-1}#trace{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}@media(max-width:720px){main{display:block}section{border-bottom:1px solid var(--line);padding:18px}header{padding:15px 18px}#graph{height:380px}.live{display:none}}
  .headright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.lang button{border:0;border-radius:0;padding:5px 11px;font-size:12px;background:transparent;color:var(--muted)}.lang button.on{background:var(--mint);color:#10261b;font-weight:650}.legend .root-dot{background:#ffd27a;width:11px;height:11px}
  </style>
</head>
<body>
<header><div><h1><span class="brand">◈</span> OnCall Brain</h1><p data-i18n="tagline"></p></div><div class="headright"><span class="live" data-i18n="live"></span><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div></div></header>
<main>
  <section aria-label="Ask and answer">
    <h2 data-i18n="h_ask"></h2>
    <form id="ask-form"><label class="hint" for="question" data-i18n="ask_label"></label><textarea id="question" maxlength="4000" required data-i18n-ph="ask_ph"></textarea><div class="examples"><button type="button" data-example="Q1" data-i18n="ex_q1"></button><button type="button" data-example="Q4" data-i18n="ex_q4"></button><button type="button" data-example="Q15" data-i18n="ex_q15"></button></div><div class="askbar"><button class="primary" id="ask-button" type="submit" data-i18n="ask_btn"></button><label class="hint mode"><input type="checkbox" id="deep"> <span data-i18n="deep"></span></label></div><p class="hint" data-i18n="cited"></p></form>
    <div id="activity" class="hint" role="status" aria-live="polite"></div><div id="answer-status"></div><div id="status-source"></div>
    <article id="answer" aria-live="polite"><div class="empty" data-i18n="answer_empty"></div></article>
  </section>
  <section aria-label="Knowledge graph">
    <div class="graph-head"><h2 data-i18n="h_graph"></h2><button id="fit" type="button" data-i18n="fit"></button></div>
    <div id="graph" role="img"></div>
    <div class="legend"><span><i class="root-dot"></i><span data-i18n="lg_root"></span></span><span><i class="node-dot"></i><span data-i18n="lg_entity"></span></span><span><i></i><span data-i18n="lg_rule"></span></span><span><i class="chat-dot"></i><span data-i18n="lg_chat"></span></span></div>
    <p class="hint" id="graph-summary" data-i18n="graph_hint"></p>
    <form id="search-form" class="searchbar"><input id="search" aria-label="Search graph" data-i18n-ph="search_ph" maxlength="500" required><button type="submit" data-i18n="search"></button></form><div id="search-results"></div><div id="node-info"></div>
  </section>
  <section aria-label="Tool trace"><div class="graph-head"><h2 data-i18n="h_trace"></h2><button id="ontology" type="button" data-i18n="ontology"></button></div><div id="trace"><div class="empty" data-i18n="trace_empty"></div></div><p class="footnote" data-i18n="footnote"></p></section>
</main>
<dialog id="evidence-dialog"><div class="dialog-head"><strong id="evidence-title">Evidence</strong><button id="close-dialog" type="button" aria-label="Close evidence">✕</button></div><div id="evidence-meta"></div><pre id="evidence-text"></pre></dialog>
<script>
'use strict';
const I18N = {
  zh: {tagline:'Graph Hacks / 先看证据，再行动', live:'● 只读知识图谱', h_ask:'01 / 向运维大脑提问', ask_label:'描述遇到的问题', ask_ph:'知识库在哪？工单该找谁？哪条规则仍有效？（建议用英文提问，语料是英文）',
    ex_q1:'Q1 · 知识库与维护人', ex_q4:'Q4 · 新人要加的群', ex_q15:'Q15 · 队列故障找谁修', ask_btn:'提问 ↗', deep:'深度模式：由模型逐步决定每次查询（较慢，约 1 分钟）', cited:'每条结论都带出处 · 点击引用查看原文',
    answer_empty:'从一个真实问题开始。回答、证据和它来自的子图会在这里连起来。', h_graph:'02 / 顺着证据看图', fit:'适配视图', lg_root:'本题读取的实体', lg_entity:'相关实体', lg_rule:'正式规则', lg_chat:'聊天 / 观察 / 惯例',
    graph_hint:'点击节点展开一跳邻居；悬停或放大可看名称，箭头是真实关系方向。', search_ph:'搜索图谱实体，例如 Pipeline', search:'搜索', h_trace:'03 / 每一步的查询记录', ontology:'本体', trace_empty:'等待提问。这里会展示每一步实际的查询、参数和用到的 Cypher 模板。',
    footnote:'模型只能使用受控工具，所有 Cypher 都由服务端模板生成。', no_excerpt:'当前结果里没有这条引用的原文摘录，请核对原始出处，不能算作证据。', view_excerpt:'查看原文摘录', unmatched:'引用未匹配，点击查看说明', no_answer:'没有返回回答。',
    all_evidence:'全部返回证据', budget:'工具预算用尽（{r}），请留意回答中的缺项。', no_trace:'没有返回查询记录。', nodes_summary:'{n} 个节点 · {e} 条关系 · 点击节点展开', truncated:'关系查询已截断为 50 条路径。',
    cdn_fail:'图组件加载失败，请检查网络后刷新；回答和引用仍可使用。', busy_deep:'深度模式：模型正在一步步决定查询，约 1 分钟…', busy_fast:'正在查图，然后组装回答…',
    done:'完成 · {mode} · {steps} 步 · {ev} 条证据', timing:' · 查图+决策 {g} 秒，组装 {c} 秒，共 {t} 秒', mode_fast:'快速模式', mode_deep:'深度模式', not_found_entity:'not_found · 没找到实体', onto_title:'本体 / 受控工具契约',
    status_src:'状态来源：{s} · 证据：本题查询结果', assertions:'条关系'},
  en: {tagline:'Graph Hacks / Evidence before action', live:'● READ-ONLY KNOWLEDGE GRAPH', h_ask:'01 / Ask your operations brain', ask_label:'Ask a question', ask_ph:'Where is the knowledge base? Who handles this ticket? Which rule is still in force?',
    ex_q1:'Q1 · Knowledge base owner', ex_q4:'Q4 · Channels to join', ex_q15:'Q15 · Who fixes the queue', ask_btn:'Ask Brain ↗', deep:'Deep mode: the model picks every query itself (slower, ~1 min)', cited:'Every claim is cited · click a citation to read the source',
    answer_empty:'Start with a real question. The answer, its evidence and the subgraph it came from appear here.', h_graph:'02 / Follow the evidence', fit:'Fit graph', lg_root:'Read for this answer', lg_entity:'Related entity', lg_rule:'Formal rule', lg_chat:'Chat / observation / practice',
    graph_hint:'Click a node to expand its neighbours; hover or zoom in to see names. Arrows show the real relation direction.', search_ph:'Search graph entities, e.g. Pipeline', search:'Search', h_trace:'03 / Query trace', ontology:'Ontology', trace_empty:'Waiting for a question. Every real query, its arguments and the Cypher templates it ran appear here.',
    footnote:'The model only uses controlled tools; every Cypher query comes from a server-side template.', no_excerpt:'No excerpt for this citation in the current results. Check the original source; this does not count as evidence.', view_excerpt:'view source excerpt', unmatched:'Unmatched citation · click for details', no_answer:'No answer returned.',
    all_evidence:'All returned evidence', budget:'Tool budget used up ({r}): check the answer for gaps.', no_trace:'No query trace returned.', nodes_summary:'{n} nodes · {e} assertions · click a node to expand', truncated:'Relation query truncated to 50 paths.',
    cdn_fail:'Graph component failed to load. Refresh after checking the network; answers and citations still work.', busy_deep:'Deep mode: the model is choosing queries step by step, about a minute...', busy_fast:'Querying the graph, then composing the answer...',
    done:'Done · {mode} · {steps} steps · {ev} evidence lines', timing:' · graph+decisions {g}s, compose {c}s, total {t}s', mode_fast:'fast mode', mode_deep:'deep mode', not_found_entity:'not_found · no matching entity', onto_title:'Ontology / controlled tool contract',
    status_src:"Status source: {s} · Evidence: this question's own results", assertions:'assertions'}
};
let lang = 'zh';
try { lang = localStorage.getItem('oncall-lang') || 'zh'; } catch(e) {}
function t(key, vars={}) { return (I18N[lang][key] ?? I18N.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ''); }
function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('oncall-lang', lang); } catch(e) {} applyLang(); }));
applyLang();
const examples = {
  Q1: "I'm a new frontline support engineer assigned to the Pipeline module. Where can I find our module knowledge base, and who maintains it?",
  Q4: "Which operational communication channels must I join as a new support engineer, and what handle naming format should I use?",
  Q15: "The Sentinel Desk dispatch queue for Mobile Build is rejecting tickets from Sunward Metro with 'Invalid Target Queue'. Should I ping Seraphina Lin to fix the queue configuration?"
};
const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if(text !== undefined) e.textContent = text; if(cls) e.className = cls; return e; };
const states = new Set(['applicable','conflict','superseded','insufficient_context','not_found','stale']);
let evidence = [], citations = [], cy = null, busy = false, graphRevision = 0;
async function api(path, options) {
  const response = await fetch(path, options);
  const data = await response.json();
  if(!response.ok) throw new Error(data.error || data.note || 'Request failed');
  return data;
}
function activity(message, error=false) { $('activity').textContent=message; $('activity').className=error?'error':'hint'; }
function showEvidence(item, label) {
  $('evidence-title').textContent=label || `${item.source}:${item.locator}`;
  $('evidence-meta').replaceChildren(el('span', item.authority || 'unknown', `badge ${item.authority || ''}`));
  $('evidence-text').textContent=item.excerpt || t('no_excerpt');
  $('evidence-dialog').showModal();
}
function appendCitations(parent, text) {
  const pattern=/\[[^\]\n]+\]/g;
  let cursor=0;
  for(const match of text.matchAll(pattern)) {
    const citation=citations.find(c=>c.text===match[0]);
    if(!citation)continue;
    parent.append(document.createTextNode(text.slice(cursor,match.index)));
    const item=evidence.find(e=>e.id===citation.evidence_id);
    const button=el('button',match[0],`citation ${item && (item.authority!=='formal_rule' || /(?:^|\/)chats\//.test(item.source))?'chat':''}`);
    button.type='button'; button.title=item?`${item.authority} · ${t('view_excerpt')}`:t('unmatched');
    button.dataset.matched=String(Boolean(item));
    if(!item)button.classList.add('error');
    button.addEventListener('click',()=>showEvidence(item || {}, match[0])); parent.append(button);
    cursor=match.index+match[0].length;
  }
  parent.append(document.createTextNode(text.slice(cursor)));
}
function renderAnswer(data) {
  evidence=data.evidence || [];
  citations=data.citations || [];
  const state=states.has(data.status)?data.status:'insufficient_context';
  $('answer-status').replaceChildren(el('span',state,`badge ${state}`));
  $('status-source').textContent=t('status_src',{s:data.status_source || 'unknown'});
  $('answer').replaceChildren();
  for(const line of (data.answer || t('no_answer')).split('\n')) {
    const heading=/^#{1,6}\s+/.test(line), p=el(heading?'h3':'p',undefined,heading?'answer-heading':'answer-line');
    appendCitations(p,line.replace(/^#{1,6}\s+/,'')); $('answer').append(p);
  }
  const details=el('details'); details.append(el('summary',`${t('all_evidence')} / ${evidence.length}`));
  for(const item of evidence){const button=el('button',`${item.source}:${item.locator} · ${item.authority}`,`citation ${item.authority==='formal_rule'?'':'chat'}`);button.type='button';button.onclick=()=>showEvidence(item);details.append(button);}
  $('answer').append(details);
  if(data.stop_reason && data.stop_reason!=='completed') $('answer').append(el('p',t('budget',{r:data.stop_reason}),'hint'));
  for(const warning of data.warnings || []) $('answer').append(el('p',warning,'error'));
  $('trace').replaceChildren();
  for(const [i,call] of (data.trace || []).entries()) {
    const card=el('div',undefined,'trace-card'); card.append(el('div',`${i+1}. ${call.tool}`,'trace-title'),el('pre',JSON.stringify(call.args || {},null,2)),el('div',(call.template || []).join(' · '),'templates'),el('span',call.status || 'unknown','hint')); $('trace').append(card);
  }
  if(!data.trace?.length) $('trace').append(el('p',t('no_trace'),'hint'));
  graphRevision++; if(cy) { cy.elements().remove(); mergeGraph(data.graph || {nodes:[],edges:[]}); }
}
function mergeGraph(graph) {
  if(!cy) return;
  cy.batch(()=>{
    for(const n of graph.nodes){const existing=cy.getElementById(n.id), data={...n,label:n.name || n.id}; if(existing.length) existing.data(data); else cy.add({group:'nodes',data});}
    for(const e of graph.edges){if(!cy.getElementById(e.id).length)cy.add({group:'edges',data:{...e,label:e.predicate}});}
  });
  cy.layout({name:'cose',animate:false,idealEdgeLength:150,nodeRepulsion:28000,componentSpacing:90,nodeOverlap:30,padding:30}).run();
  $('graph-summary').textContent=t('nodes_summary',{n:cy.nodes().length,e:cy.edges().length});
}
async function expandNode(id) {
  const revision=graphRevision;
  try {
    const [node,neighbors]=await Promise.all([api(`/api/node/${encodeURIComponent(id)}`),api(`/api/neighbors/${encodeURIComponent(id)}`)]);
    if(revision!==graphRevision)return;
    mergeGraph(neighbors.graph);
    const unique=new Map(evidence.map(e=>[e.id,e]));for(const item of node.evidence || [])unique.set(item.id,item);evidence=[...unique.values()];
    $('node-info').replaceChildren(el('strong',node.entity.name || id),el('p',`${id} · ${node.entity.kind} · ${node.assertions.length} ${t('assertions')}`));
    for(const item of node.evidence || []) {const b=el('button',`${item.source}:${item.locator}`,`citation ${item.authority==='formal_rule'?'':'chat'}`);b.onclick=()=>showEvidence(item);$('node-info').append(b);}
    if(neighbors.truncated)$('node-info').append(el('p',t('truncated'),'hint'));
  } catch(error) { activity(error.message,true); }
}
if(window.cytoscape) {
  cy=cytoscape({container:$('graph'),elements:[],style:[
    {selector:'node',style:{label:'data(label)','background-color':'#8abaff',color:'#e5edf7','font-size':10,'text-wrap':'wrap','text-max-width':110,'text-valign':'bottom','text-margin-y':6,width:18,height:18,'text-opacity':0,'text-background-color':'#111820','text-background-opacity':.8,'text-background-padding':2}},
    {selector:'node[?root]',style:{width:34,height:34,'font-size':12,'font-weight':650,'text-opacity':1,'border-width':3,'border-color':'#ffd27a','z-index':10}},
    {selector:'node.hover,node:selected,node.near',style:{'text-opacity':1,'z-index':20}},
    {selector:'node[kind = "Person"]',style:{'background-color':'#bdadff'}},
    {selector:'node[kind = "Rule"]',style:{'background-color':'#79dfb2',shape:'round-rectangle'}},
    {selector:'node[superseded = true]',style:{opacity:.5}},
    {selector:'edge',style:{width:1.2,'line-color':'#4b6f68','target-arrow-color':'#4b6f68','target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier',label:'data(label)','font-size':8,color:'#a2afbf','text-opacity':0,'text-rotation':'autorotate','text-background-color':'#111820','text-background-opacity':.85,'text-background-padding':2}},
    {selector:'edge.near',style:{'text-opacity':1,width:2,'line-color':'#79dfb2','target-arrow-color':'#79dfb2','z-index':20}},
    {selector:'edge[authority = "observation"],edge[authority = "practice"]',style:{'line-color':'#f5c56c','target-arrow-color':'#f5c56c','line-style':'dashed'}},
    {selector:'edge[directed = false]',style:{'target-arrow-shape':'none'}},
    {selector:':selected',style:{'border-width':3,'border-color':'#fff'}}]});
  cy.on('tap','node',event=>expandNode(event.target.id()));
  // Names show for nodes this answer read; hovering reveals a node, its neighbours and their relations.
  cy.on('mouseover','node',e=>{e.target.addClass('hover');e.target.neighborhood().addClass('near');});
  cy.on('mouseout','node',e=>{e.target.removeClass('hover');e.target.neighborhood().removeClass('near');});
  cy.on('zoom',()=>cy.nodes().not('[?root]').style('text-opacity',cy.zoom()>1.6?1:0));
} else { $('graph').append(el('p',t('cdn_fail'),'error')); }
$('ask-form').addEventListener('submit',async event=>{
  event.preventDefault();if(busy || !$('question').value.trim())return;
  busy=true;$('ask-button').disabled=true;document.querySelectorAll('[data-example]').forEach(b=>b.disabled=true);activity($('deep').checked?t('busy_deep'):t('busy_fast'));
  try { const data=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value,mode:$('deep').checked?'deep':'fast'})});renderAnswer(data);const tm=data.timings; activity(t('done',{mode:t(data.mode==='deep'?'mode_deep':'mode_fast'),steps:data.trace?.length ?? data.tool_calls ?? 0,ev:data.evidence.length})+(tm?t('timing',{g:(tm.retrieve+tm.decide+tm.read+(tm.hop||0)).toFixed(1),c:tm.compose.toFixed(1),t:tm.total.toFixed(1)}):'')); }
  catch(error){activity(error.message,true);}
  finally{busy=false;$('ask-button').disabled=false;document.querySelectorAll('[data-example]').forEach(b=>b.disabled=false);}
});
document.querySelectorAll('[data-example]').forEach(button=>button.addEventListener('click',()=>{$('question').value=examples[button.dataset.example];$('ask-form').requestSubmit();}));
$('search-form').onsubmit=async event=>{event.preventDefault();try{const data=await api(`/api/search?q=${encodeURIComponent($('search').value)}`);$('search-results').replaceChildren();for(const n of data.candidates || []){const b=el('button',`${n.name} · ${n.kind}`);b.onclick=()=>expandNode(n.id);$('search-results').append(b);}if(!data.candidates?.length)$('search-results').append(el('span',t('not_found_entity'),'hint'));}catch(error){activity(error.message,true);}};
$('ontology').onclick=async()=>{try{const data=await api('/api/ontology');$('evidence-title').textContent=t('onto_title');$('evidence-meta').replaceChildren();$('evidence-text').textContent=JSON.stringify(data,null,2);$('evidence-dialog').showModal();}catch(error){activity(error.message,true);}};
$('fit').onclick=()=>cy?.fit(undefined,30);
$('close-dialog').onclick=()=>$('evidence-dialog').close();
</script>
</body>
</html>
